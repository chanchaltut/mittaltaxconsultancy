        "name": "What does GST registration cost in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "GST registration through MT Consultancy starts at ₹999 (professional fee only). Government fees for GST registration on gst.gov.in are nil — it is free. The professional fee covers documentation, ARN generation, query resolution, and follow-up until the GSTIN is issued, typically within 3–7 working days."
        }
      },
      {
        "@type": "Question",
        "name": "What documents are required for ITR filing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Documents required for ITR filing include: PAN card, Aadhaar card, Form 16 (for salaried individuals), Form 26AS and AIS from incometax.gov.in, bank statements, investment proofs (80C, 80D), home loan interest certificate, and details of any capital gains. For business owners, additionally required are profit & loss account and balance sheet."
        }
      },
      {
        "@type": "Question",
        "name": "How long does company registration take in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Company registration (Private Limited Company) in India typically takes 7–15 working days through the MCA SPICe+ portal. This includes obtaining DIN (Director Identification Number), DSC (Digital Signature Certificate), name approval, and Certificate of Incorporation. MT Consultancy handles the entire process online with no office visit required."
        }
      },
      {
        "@type": "Question",
        "name": "Is MT Consultancy open 24 hours?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. MT Consultancy is open 24 hours, 7 days a week. You can reach us via WhatsApp or email at mtconsultancyinfo@gmail.com at any time for queries, document submission, or consultation on GST, ITR, TDS, company registration, or any other compliance service."
        }
      },
      {
        "@type": "Question",
        "name": "What is the penalty for not filing GST returns?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The penalty for late GST return filing is ₹50 per day (₹25 CGST + ₹25 SGST) for regular taxpayers, with a maximum of ₹5,000. For NIL returns, the late fee is ₹20 per day (₹10 + ₹10), capped at ₹500. Additionally, interest at 18% per annum applies on the unpaid tax amount. Non-filing can also lead to GSTIN suspension."
        }
      },
      {
        "@type": "Question",
        "name": "What is the GST registration threshold in India 2025?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "As of 2025, GST registration is mandatory if annual aggregate turnover exceeds: ₹40 lakh for goods suppliers in most states (₹20 lakh in special category states), ₹20 lakh for service providers (₹10 lakh in special category states). E-commerce operators and inter-state suppliers must register regardless of turnover. MT Consultancy provides free eligibility assessment."
        }
      },
      {
        "@type": "Question",
        "name": "What is the TDS deduction rate for professional services?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TDS on professional and technical services under Section 194J is 10% when the payment exceeds ₹30,000 in a financial year. TDS must be deducted at source and deposited by the 7th of the following month, with quarterly TDS returns (Form 26Q) filed by MT Consultancy."
        }
      },
      {
        "@type": "Question",
        "name": "What is MSME Udyam registration and is it free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Udyam Registration is the official MSME registration on udyamregistration.gov.in, replacing the old Udyog Aadhaar. It is completely free on the government portal. MT Consultancy charges only a professional fee for guidance and documentation. Benefits include priority lending, subsidy eligibility, and lower interest rates."
        }
      },
      {
        "@type": "Question",
        "name": "What is the fee for professional services at MT Consultancy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Professional service fees at MT Consultancy: GST Registration from ₹999, ITR Filing (salaried) from ₹499, Company Registration from ₹4,999, TDS return from ₹1,499/quarter, Project Reports from ₹2,999, CA Certificates from ₹1,499. All fees are fixed and transparent — government fees are shown separately at actuals. We issue proper GST invoices for all payments."
        }
      },
      {
        "@type": "Question",
        "name": "Where is MT Consultancy located?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "MT Consultancy is based in East Delhi - 110092, India. However, all services are delivered 100% online — you can share documents via WhatsApp or email from anywhere in India, and we handle the complete process on government portals on your behalf. Contact: mtconsultancyinfo@gmail.com. LinkedIn: https://www.linkedin.com/in/mittal0444"
        }
      }
